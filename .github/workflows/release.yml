name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc gdb

      - name: Run tests
        run: node test/run-tests.js

      - name: Package VSIX
        run: npx --yes @vscode/vsce package --no-dependencies

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'

      - name: Attach VSIX to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          generate_release_notes: true

      # 想顺便发布到 VS Code 插件市场：在仓库 Settings -> Secrets 添加 VSCE_PAT，然后取消下面注释
